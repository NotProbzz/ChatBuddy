<!doctype html>
<html lang="en">
  <head>
    <script>
      (function() {
        try {
          const orig = window.fetch;
          Object.defineProperty(window, 'fetch', {
            get: () => orig,
            set: (v) => { console.log('Prevented fetch override'); },
            configurable: true
          });
        } catch (e) { console.error('fetch patch failed', e); }
      })();
    </script>
